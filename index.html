<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mijn Recepten — V2</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#425646"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f5f3ee;--paper:#fff;--ink:#24231f;--muted:#77736b;--line:#ddd8cf;--accent:#425646;--soft:#e9eee8;--danger:#9d3f35}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.app{max-width:1180px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:5;background:rgba(245,243,238,.94);backdrop-filter:blur(14px);padding:20px 22px 12px;border-bottom:1px solid var(--line)}.brand{font-family:Georgia,serif;font-size:29px}.sub{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.search,.field{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px}.search{flex:1;min-width:220px}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--accent);color:#fff;font-weight:650;cursor:pointer}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--danger)}main{padding:22px}.chips{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;cursor:pointer}.chip.on{background:var(--accent);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:17px}.card{background:#fff;border-radius:18px;overflow:hidden;border:1px solid var(--line);cursor:pointer;box-shadow:0 5px 18px #00000008}.thumb{height:150px;background:linear-gradient(135deg,#d9dfd5,#ece7dc);display:grid;place-items:center;color:#6b7168;font-size:42px;background-size:cover;background-position:center}.cardbody{padding:14px}.card h3{font:20px Georgia,serif;margin:0 0 7px}.meta{color:var(--muted);font-size:13px}.stars{letter-spacing:1px;color:#8a6d2e}.empty{text-align:center;padding:70px 15px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0007;z-index:20;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px}.modal.show{display:flex}.sheet{width:min(900px,100%);background:#faf9f6;border-radius:22px;overflow:hidden;box-shadow:0 24px 70px #0004}.sheethead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:#faf9f6;z-index:2}.sheethead h2{font:24px Georgia,serif;margin:0}.close{border:0;background:transparent;font-size:27px;cursor:pointer}.content{padding:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.span2{grid-column:1/-1}.label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 5px;text-transform:uppercase;letter-spacing:.04em}.field{width:100%}.rows{display:grid;gap:8px}.row{display:flex;gap:8px}.row .field{flex:1}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;width:42px;cursor:pointer}.section{margin-top:22px}.section h3{font:20px Georgia,serif;margin:0 0 10px}.foot{display:flex;gap:9px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--line);flex-wrap:wrap}.importbox{background:var(--soft);border-radius:14px;padding:14px}.hint{font-size:12px;color:var(--muted);margin-top:7px}.recipe{background:#fff}.hero{min-height:250px;background:#e7e4dc;background-size:cover;background-position:center;display:flex;align-items:flex-end}.heroTitle{width:100%;padding:60px 24px 20px;background:linear-gradient(transparent,#000b);color:white}.heroTitle h1{font:34px Georgia,serif;margin:0}.recipebody{padding:22px}.facts{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);margin:12px 0 24px}.fact{padding:10px;border-right:1px solid var(--line)}.fact:last-child{border:0}.fact b{display:block;font:italic 16px Georgia,serif}.columns{display:grid;grid-template-columns:.8fr 1.2fr;gap:32px}.ingredients li{margin-bottom:7px}.steps{counter-reset:step;list-style:none;padding:0}.steps li{counter-increment:step;display:grid;grid-template-columns:32px 1fr;gap:9px;margin:0 0 14px}.steps li:before{content:counter(step);width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700}.source{word-break:break-all;color:var(--muted)}
@media(max-width:650px){.formgrid,.columns{grid-template-columns:1fr}.span2{grid-column:auto}.facts{grid-template-columns:1fr 1fr}.fact{border-bottom:1px solid var(--line)}.modal{padding:0}.sheet{border-radius:0;min-height:100vh}.top{padding-top:calc(16px + env(safe-area-inset-top))}.heroTitle h1{font-size:29px}}
@media print{body{background:white}.app,#editModal,.sheethead,.foot,.noPrint{display:none!important}#viewModal{display:block!important;position:static;background:white;padding:0}.sheet{box-shadow:none;width:100%;border-radius:0}.recipebody{padding:0 7mm}.hero{height:80mm}.facts{margin-top:8mm}.columns{gap:12mm}@page{size:A4;margin:12mm}}
</style></head><body>
<div class="app"><header class="top"><div class="brand">Mijn Recepten</div><div class="sub">Persoonlijk kookboek</div><div class="toolbar"><input id="search" class="search" placeholder="Zoek op recept, ingrediënt, chef…"><button class="btn alt" onclick="openImport()">↗ Importeer link</button><button class="btn alt" onclick="exportBackup()">↓ Back-up</button><label class="btn alt">↑ Herstel<input id="restoreFile" type="file" accept="application/json" hidden onchange="restoreBackup(event)"></label><button class="btn" onclick="newRecipe()">＋ Nieuw recept</button></div></header><main><div class="chips" id="chips"></div><div id="grid" class="grid"></div></main></div>
<div class="modal" id="editModal"><div class="sheet"><div class="sheethead"><h2 id="editTitle">Recept</h2><button class="close" onclick="closeEdit()">×</button></div><div class="content"><div class="importbox span2" id="importArea" style="display:none"><label class="label">Recept van website importeren</label><div class="row"><input id="importUrl" class="field" placeholder="https://…"><button class="btn" onclick="importRecipe()">Importeer</button></div><div class="hint" id="importStatus">De app zoekt naar Recipe/JSON-LD. Je kunt daarna alles wijzigen.</div></div><div class="formgrid" style="margin-top:14px"><div class="span2"><label class="label">Titel</label><input id="title" class="field"></div><div><label class="label">Soort</label><input id="type" class="field"></div><div><label class="label">Seizoen</label><input id="season" class="field"></div><div><label class="label">Aantal / porties</label><input id="servings" class="field"></div><div><label class="label">Wijn</label><input id="wine" class="field"></div><div><label class="label">Chef / bron</label><input id="chef" class="field"></div><div><label class="label">Beoordeling</label><select id="rating" class="field"><option value="0">Nog niet beoordeeld</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div class="span2"><label class="label">Originele bronlink</label><input id="source" class="field"></div><div class="span2"><label class="label">Foto URL</label><input id="image" class="field"></div></div><div class="section"><h3>Ingrediënten</h3><div id="ingredientRows" class="rows"></div><button class="btn alt" onclick="addIngredient()">＋ Ingrediënt</button></div><div class="section"><h3>Bereiding</h3><div id="stepRows" class="rows"></div><button class="btn alt" onclick="addStep()">＋ Stap</button></div><div class="section"><h3>Eigen notities</h3><textarea id="notes" class="field" rows="4"></textarea></div></div><div class="foot"><button id="deleteBtn" class="btn danger" onclick="deleteCurrent()">Verwijder</button><button class="btn alt" onclick="closeEdit()">Annuleer</button><button class="btn" onclick="saveRecipe()">Bewaar recept</button></div></div></div>
<div class="modal" id="viewModal"><div class="sheet recipe"><div class="sheethead"><h2>Receptenblad</h2><div><button class="btn alt" onclick="printRecipe()">Afdrukken</button> <button class="btn alt" onclick="editFromView()">Bewerken</button> <button class="close" onclick="closeView()">×</button></div></div><div id="recipeView"></div></div></div>
<script>
const KEY='mijn-recepten-v1';let recipes=JSON.parse(localStorage.getItem(KEY)||'[]'),current=null,filter='Alles';const $=id=>document.getElementById(id),esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seed(){if(recipes.length)return;recipes=[{id:crypto.randomUUID(),title:'Voorbeeld: Pasta met citroen',type:'Hoofdgerecht',season:'Zomer',servings:'4 personen',wine:'Frisse witte wijn',chef:'Eigen recept',rating:4,source:'',image:'',ingredients:['400 g pasta','2 citroenen','80 g Parmezaan','150 ml room','Peper en zout'],steps:['Kook de pasta beetgaar.','Rasp de citroenschil en pers één citroen uit.','Meng room, citroen en Parmezaan door de pasta.','Kruid en serveer meteen.'],notes:'Voorbeeldrecept — mag verwijderd worden.'}];persist()}
function persist(){localStorage.setItem(KEY,JSON.stringify(recipes));render()}function setFilter(x){filter=x;render()}$('search').addEventListener('input',render);
function render(){let q=$('search').value.toLowerCase(),cats=['Alles',...new Set(recipes.map(r=>r.type).filter(Boolean))];$('chips').innerHTML='';cats.forEach(c=>{let b=document.createElement('button');b.className='chip '+(c===filter?'on':'');b.textContent=c;b.onclick=()=>setFilter(c);$('chips').appendChild(b)});let list=recipes.filter(r=>(filter==='Alles'||r.type===filter)&&JSON.stringify(r).toLowerCase().includes(q));$('grid').innerHTML='';if(!list.length){$('grid').innerHTML='<div class="empty">Nog geen recepten gevonden.<br>Voeg er eentje toe of importeer een link.</div>';return}list.forEach(r=>{let a=document.createElement('article');a.className='card';a.onclick=()=>viewRecipe(r.id);let t=document.createElement('div');t.className='thumb';if(r.image)t.style.backgroundImage='url("'+r.image.replace(/"/g,'%22')+'")';else t.textContent='🍽️';let b=document.createElement('div');b.className='cardbody';b.innerHTML='<h3>'+esc(r.title||'Naamloos recept')+'</h3><div class="stars">'+'★'.repeat(+r.rating||0)+'☆'.repeat(5-(+r.rating||0))+'</div><div class="meta">'+esc([r.type,r.season,r.servings].filter(Boolean).join(' · '))+'</div>';a.append(t,b);$('grid').appendChild(a)})}
function blank(){return{id:null,title:'',type:'',season:'',servings:'',wine:'',chef:'',rating:0,source:'',image:'',ingredients:[''],steps:[''],notes:''}}function newRecipe(){current=blank();fillForm();$('importArea').style.display='none';$('deleteBtn').style.display='none';$('editTitle').textContent='Nieuw recept';$('editModal').classList.add('show')}function openImport(){current=blank();fillForm();$('importArea').style.display='block';$('deleteBtn').style.display='none';$('editTitle').textContent='Importeer recept';$('editModal').classList.add('show')}
function fillForm(){['title','type','season','servings','wine','chef','rating','source','image','notes'].forEach(k=>$(k).value=current[k]??'');drawRows()}function drawRows(){$('ingredientRows').innerHTML=current.ingredients.map((x,i)=>'<div class="row"><input class="field ing" value="'+esc(x)+'"><button class="iconbtn" onclick="removeIng('+i+')">×</button></div>').join('');$('stepRows').innerHTML=current.steps.map((x,i)=>'<div class="row"><textarea class="field step" rows="2">'+esc(x)+'</textarea><button class="iconbtn" onclick="removeStep('+i+')">×</button></div>').join('')}function syncRows(){current.ingredients=[...document.querySelectorAll('.ing')].map(x=>x.value);current.steps=[...document.querySelectorAll('.step')].map(x=>x.value)}function addIngredient(){syncRows();current.ingredients.push('');drawRows()}function addStep(){syncRows();current.steps.push('');drawRows()}function removeIng(i){syncRows();current.ingredients.splice(i,1);if(!current.ingredients.length)current.ingredients=[''];drawRows()}function removeStep(i){syncRows();current.steps.splice(i,1);if(!current.steps.length)current.steps=[''];drawRows()}
function saveRecipe(){syncRows();['title','type','season','servings','wine','chef','rating','source','image','notes'].forEach(k=>current[k]=$(k).value);current.ingredients=current.ingredients.filter(Boolean);current.steps=current.steps.filter(Boolean);if(!current.title.trim()){alert('Geef het recept eerst een titel.');return}if(!current.id){current.id=crypto.randomUUID();recipes.unshift(current)}else recipes[recipes.findIndex(r=>r.id===current.id)]=current;persist();closeEdit();viewRecipe(current.id)}function closeEdit(){$('editModal').classList.remove('show')}function closeView(){$('viewModal').classList.remove('show')}function deleteCurrent(){if(current?.id&&confirm('Dit recept verwijderen?')){recipes=recipes.filter(r=>r.id!==current.id);persist();closeEdit()}}
function viewRecipe(id){current=recipes.find(r=>r.id===id);let r=current,v=$('recipeView');v.innerHTML='<div class="hero"><div class="heroTitle"><div class="stars">'+'★'.repeat(+r.rating||0)+'☆'.repeat(5-(+r.rating||0))+'</div><h1>'+esc(r.title)+'</h1></div></div><div class="recipebody"><div class="facts">'+[['Soort',r.type],['Seizoen',r.season],['Aantal',r.servings],['Wijn',r.wine],['Chef / Bron',r.chef]].map(x=>'<div class="fact"><b>'+x[0]+'</b>'+esc(x[1]||'—')+'</div>').join('')+'</div><div class="columns"><section><h2>Ingrediënten</h2><ul class="ingredients">'+r.ingredients.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+(r.notes?'<h2>Notities</h2><p>'+esc(r.notes).replace(/\n/g,'<br>')+'</p>':'')+'</section><section><h2>Bereiding</h2><ol class="steps">'+r.steps.map(x=>'<li><span>'+esc(x)+'</span></li>').join('')+'</ol></section></div>'+(r.source?'<p class="source"><b>Originele bron:</b> '+esc(r.source)+'</p>':'')+'</div>';let hero=v.querySelector('.hero');if(r.image)hero.style.backgroundImage='url("'+r.image.replace(/"/g,'%22')+'")';$('viewModal').classList.add('show')}function editFromView(){closeView();fillForm();$('importArea').style.display='none';$('deleteBtn').style.display='inline-block';$('editTitle').textContent='Recept bewerken';$('editModal').classList.add('show')}function printRecipe(){window.print()}
function exportBackup(){let blob=new Blob([JSON.stringify({app:'Mijn Recepten',version:2,exportedAt:new Date().toISOString(),recipes},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mijn-recepten-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}async function restoreBackup(ev){let f=ev.target.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text()),x=Array.isArray(d)?d:d.recipes;if(!Array.isArray(x))throw 0;if(confirm('Huidige recepten vervangen door deze back-up?')){recipes=x;persist();alert('Back-up hersteld.')}}catch(e){alert('Geen geldige back-up.')}ev.target.value=''}
function findRecipe(o){if(!o)return null;if(Array.isArray(o)){for(let x of o){let y=findRecipe(x);if(y)return y}}else if(typeof o==='object'){let t=o['@type'];if(t==='Recipe'||(Array.isArray(t)&&t.includes('Recipe')))return o;if(o['@graph'])return findRecipe(o['@graph'])}return null}function normalizeInstructions(v){if(!v)return[];if(typeof v==='string')return v.split(/\n+/).filter(Boolean);if(Array.isArray(v))return v.flatMap(x=>typeof x==='string'?[x]:x.itemListElement?normalizeInstructions(x.itemListElement):x.text?[x.text]:[]);return v.text?[v.text]:[]}
async function importRecipe(){let url=$('importUrl').value.trim();if(!url)return;$('importStatus').textContent='Bezig met ophalen…';try{let text;try{let res=await fetch(url);if(!res.ok)throw 0;text=await res.text()}catch(e){let res=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url));if(!res.ok)throw Error('Pagina kon niet worden opgehaald');text=await res.text()}let doc=new DOMParser().parseFromString(text,'text/html'),data=null;for(let s of doc.querySelectorAll('script[type="application/ld+json"]')){try{data=findRecipe(JSON.parse(s.textContent));if(data)break}catch(e){}}if(!data)throw Error('Geen gestructureerd recept gevonden.');current.title=data.name||'';current.servings=Array.isArray(data.recipeYield)?data.recipeYield.join(', '):(data.recipeYield||'');current.chef=(typeof data.author==='string'?data.author:(Array.isArray(data.author)?data.author.map(a=>a.name).join(', '):data.author?.name))||'';current.source=url;current.ingredients=data.recipeIngredient||[''];current.steps=normalizeInstructions(data.recipeInstructions);let im=data.image;current.image=typeof im==='string'?im:Array.isArray(im)?(typeof im[0]==='string'?im[0]:im[0]?.url):im?.url||'';current.type=data.recipeCategory||'';fillForm();$('importArea').style.display='block';$('importUrl').value=url;$('importStatus').textContent='Recept gevonden. Controleer en pas alles aan vóór je bewaart.'}catch(e){$('importStatus').textContent='Importeren lukte niet automatisch: '+e.message+' Je kunt het recept hieronder handmatig invullen.'}}
seed();render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
