<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mijn Recepten — V4</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#425646"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f5f3ee;--paper:#fff;--ink:#24231f;--muted:#77736b;--line:#ddd8cf;--accent:#425646;--soft:#e9eee8;--danger:#9d3f35}*{box-sizing:border-box}body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.app{max-width:1180px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:5;background:#f5f3eef2;backdrop-filter:blur(14px);padding:20px 22px 12px;border-bottom:1px solid var(--line)}.brand{font:29px Georgia,serif}.sub,.meta,.hint{color:var(--muted)}.sub,.hint{font-size:12px}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) auto auto;gap:10px;margin-top:14px;align-items:center}.quick,.tools,.photoActions{display:flex;gap:8px}.search,.field{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--accent);color:#fff;font-weight:650;cursor:pointer}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--danger)}.btn.small{padding:9px 12px}.more{display:none;position:relative}.more summary{list-style:none}.more summary::-webkit-details-marker{display:none}.moreBox{position:absolute;right:0;top:45px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 12px 35px #0002;min-width:160px;z-index:9}.moreBox .btn{width:100%;margin:3px 0;text-align:left}main{padding:22px}.chips{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px}.chip.on{background:var(--accent);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:17px}.card{background:#fff;border-radius:18px;overflow:hidden;border:1px solid var(--line);cursor:pointer;box-shadow:0 5px 18px #00000008}.thumb{height:150px;background:linear-gradient(135deg,#d9dfd5,#ece7dc);display:grid;place-items:center;font-size:42px;background-size:cover;background-position:center}.cardbody{padding:14px}.card h3{font:20px Georgia,serif;margin:0 0 7px}.meta{font-size:13px}.stars{color:#8a6d2e;letter-spacing:1px}.empty{text-align:center;padding:70px 15px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0007;z-index:20;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px}.modal.show{display:flex}.sheet{width:min(900px,100%);background:#faf9f6;border-radius:22px;overflow:hidden;box-shadow:0 24px 70px #0004}.sheethead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:#faf9f6;z-index:2}.sheethead h2{font:24px Georgia,serif;margin:0}.close{border:0;background:transparent;font-size:27px}.content{padding:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.span2{grid-column:1/-1}.label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 5px;text-transform:uppercase}.row{display:flex;gap:8px}.rows{display:grid;gap:8px}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;width:42px}.section{margin-top:22px}.section h3{font:20px Georgia,serif;margin:0 0 10px}.foot{display:flex;gap:9px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--line);flex-wrap:wrap}.importbox{background:var(--soft);border-radius:14px;padding:14px}.status{margin-top:8px;padding:9px 11px;border-radius:10px;background:#fff8;display:none}.status.show{display:block}.status.ok{color:#2f5b39}.status.err{color:#8c352d}.photoBox{display:flex;gap:12px;align-items:center;padding:12px;border:1px dashed var(--line);border-radius:14px;background:#fff}.photoPreview{width:92px;height:72px;border-radius:11px;background:var(--soft);background-size:cover;background-position:center;display:grid;place-items:center;color:var(--muted);flex:0 0 auto}.hero{min-height:250px;background:#e7e4dc;background-size:cover;background-position:center;display:flex;align-items:flex-end}.heroTitle{width:100%;padding:60px 24px 20px;background:linear-gradient(transparent,#000b);color:white}.heroTitle h1{font:34px Georgia,serif;margin:0}.recipebody{padding:22px}.facts{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);margin:12px 0 24px}.fact{padding:10px;border-right:1px solid var(--line)}.fact b{display:block;font:italic 16px Georgia,serif}.columns{display:grid;grid-template-columns:.8fr 1.2fr;gap:32px}.ingredients li{margin-bottom:7px}.steps{counter-reset:s;list-style:none;padding:0}.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:9px;margin-bottom:14px}.steps li:before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700}.steps li.step-section{counter-increment:none;display:block;grid-template-columns:none;margin:24px 0 12px;font-weight:800;font-size:17px}.steps li.step-section:before{content:none;display:none}.source{word-break:break-word;color:var(--muted)}.source a{color:var(--accent)}
@media(max-width:650px){.top{position:relative;padding:calc(16px + env(safe-area-inset-top)) 16px 12px}.toolbar{grid-template-columns:1fr auto}.search{grid-column:1/-1}.quick{grid-column:1/2}.quick .btn{flex:1}.tools{display:none}.more{display:block;grid-column:2}.brand{font-size:27px}main{padding:16px}.grid{grid-template-columns:1fr 1fr;gap:11px}.thumb{height:118px}.cardbody{padding:11px}.card h3{font-size:17px;line-height:1.2}.meta,.stars{font-size:12px}.formgrid,.columns{grid-template-columns:1fr}.span2{grid-column:auto}.facts{grid-template-columns:1fr 1fr}.modal{padding:0}.sheet{border-radius:0;min-height:100vh}.heroTitle h1{font-size:29px}.importbox .row{flex-direction:column}}
@media print{body{background:#fff}.app,#editModal,.sheethead,.foot{display:none!important}#viewModal{display:block!important;position:static;background:#fff;padding:0}.sheet{box-shadow:none;width:100%;border-radius:0}.recipebody{padding:0 7mm}.hero{height:80mm}@page{size:A4;margin:12mm}}
</style></head><body>
<div class="app"><header class="top"><div class="brand">Mijn Recepten</div><div class="sub">Persoonlijk kookboek · V4</div><div class="toolbar"><input id="search" class="search" placeholder="Zoek in je recepten…"><div class="quick"><button class="btn alt" onclick="openImport()">↗ Importeer</button><button class="btn" onclick="newRecipe()">＋ Nieuw recept</button></div><div class="tools"><button class="btn alt small" onclick="exportBackup()">↓ Back-up</button><label class="btn alt small">↑ Herstel<input type="file" accept="application/json" hidden onchange="restoreBackup(event)"></label></div><details class="more"><summary class="btn alt small">•••</summary><div class="moreBox"><button class="btn alt small" onclick="exportBackup()">↓ Back-up</button><label class="btn alt small">↑ Herstel<input type="file" accept="application/json" hidden onchange="restoreBackup(event)"></label></div></details></div></header><main><div class="chips" id="chips"></div><div id="grid" class="grid"></div></main></div>
<div class="modal" id="editModal"><div class="sheet"><div class="sheethead"><h2 id="editTitle">Recept</h2><button class="close" onclick="closeEdit()">×</button></div><div class="content"><div class="importbox" id="importArea" style="display:none"><label class="label">Recept van website importeren</label><div class="row"><input id="importUrl" class="field" inputmode="url" placeholder="Plak hier de link naar het recept"><button id="importBtn" class="btn" onclick="importRecipe()">Importeer</button></div><div id="importStatus" class="status"></div><div class="hint">De website wordt veilig via onze importserver opgehaald. Daarna kun je alles nog aanpassen.</div></div><div class="formgrid" style="margin-top:14px"><div class="span2"><label class="label">Titel</label><input id="title" class="field"></div><div><label class="label">Soort</label><input id="type" class="field"></div><div><label class="label">Seizoen</label><input id="season" class="field"></div><div><label class="label">Aantal / porties</label><input id="servings" class="field"></div><div><label class="label">Wijn</label><input id="wine" class="field"></div><div><label class="label">Chef / bron</label><input id="chef" class="field"></div><div><label class="label">Beoordeling</label><select id="rating" class="field"><option value="0">Nog niet beoordeeld</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div class="span2"><label class="label">Originele bronlink</label><input id="source" class="field"></div><div class="span2"><label class="label">Receptfoto</label><div class="photoBox"><div id="photoPreview" class="photoPreview">Geen foto</div><div class="photoActions"><label class="btn alt small">Kies foto<input type="file" accept="image/*" hidden onchange="choosePhoto(event)"></label><button class="btn alt small" onclick="removePhoto()">Verwijder</button></div></div><input id="image" type="hidden"></div></div><div class="section"><h3>Ingrediënten</h3><div id="ingredientRows" class="rows"></div><button class="btn alt" onclick="addIngredient()">＋ Ingrediënt</button></div><div class="section"><h3>Bereiding</h3><div id="stepRows" class="rows"></div><button class="btn alt" onclick="addStep()">＋ Stap</button></div><div class="section"><h3>Eigen notities</h3><textarea id="notes" class="field" rows="4"></textarea></div></div><div class="foot"><button id="deleteBtn" class="btn danger" onclick="deleteCurrent()">Verwijder</button><button class="btn alt" onclick="closeEdit()">Annuleer</button><button class="btn" onclick="saveRecipe()">Bewaar recept</button></div></div></div>
<div class="modal" id="viewModal"><div class="sheet"><div class="sheethead"><h2>Receptenblad</h2><div><button class="btn alt" onclick="print()">Afdrukken</button> <button class="btn alt" onclick="editFromView()">Bewerken</button> <button class="close" onclick="closeView()">×</button></div></div><div id="recipeView"></div></div></div>
<script>
const KEY='mijn-recepten-v1',API='https://receptenboek.vercel.app/api/import';let recipes=JSON.parse(localStorage.getItem(KEY)||'[]'),current=null,filter='Alles';const $=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function blank(){return{id:null,title:'',type:'',season:'',servings:'',wine:'',chef:'',rating:0,source:'',image:'',ingredients:[''],steps:[''],notes:''}}function seed(){if(recipes.length)return;recipes=[{...blank(),id:crypto.randomUUID(),title:'Voorbeeld: Pasta met citroen',type:'Hoofdgerecht',season:'Zomer',servings:'4 personen',wine:'Frisse witte wijn',chef:'Eigen recept',rating:4,ingredients:['400 g pasta','2 citroenen','80 g Parmezaan','150 ml room','Peper en zout'],steps:['Kook de pasta beetgaar.','Rasp de citroenschil en pers één citroen uit.','Meng room, citroen en Parmezaan door de pasta.','Kruid en serveer meteen.'],notes:'Voorbeeldrecept — mag verwijderd worden.'}];persist()}function persist(){try{localStorage.setItem(KEY,JSON.stringify(recipes));render()}catch(e){alert('De lokale opslag is vol. Maak een back-up en gebruik kleinere foto’s.')}}$('search').oninput=render;
function render(){let q=$('search').value.toLowerCase(),cats=['Alles',...new Set(recipes.map(r=>r.type).filter(Boolean))];$('chips').innerHTML='';cats.forEach(c=>{let b=document.createElement('button');b.className='chip '+(c===filter?'on':'');b.textContent=c;b.onclick=()=>{filter=c;render()};$('chips').append(b)});let list=recipes.filter(r=>(filter==='Alles'||r.type===filter)&&JSON.stringify(r).toLowerCase().includes(q));$('grid').innerHTML='';if(!list.length){$('grid').innerHTML='<div class="empty">Nog geen recepten gevonden.<br>Voeg er eentje toe of importeer een link.</div>';return}list.forEach(r=>{let a=document.createElement('article');a.className='card';a.onclick=()=>viewRecipe(r.id);let t=document.createElement('div');t.className='thumb';if(r.image)t.style.backgroundImage=`url("${r.image.replace(/"/g,'%22')}")`;else t.textContent='🍽️';let b=document.createElement('div');b.className='cardbody';b.innerHTML=`<h3>${esc(r.title||'Naamloos recept')}</h3><div class="stars">${'★'.repeat(+r.rating||0)}${'☆'.repeat(5-(+r.rating||0))}</div><div class="meta">${esc([r.type,r.season,r.servings].filter(Boolean).join(' · '))}</div>`;a.append(t,b);$('grid').append(a)})}
function newRecipe(){current=blank();openEditor('Nieuw recept',false)}function openImport(){current=blank();openEditor('Importeer recept',true);$('importUrl').value='';setStatus('')}function openEditor(title,imp){fillForm();$('editTitle').textContent=title;$('importArea').style.display=imp?'block':'none';$('deleteBtn').style.display=current.id?'inline-block':'none';$('editModal').classList.add('show')}function closeEdit(){$('editModal').classList.remove('show')}function closeView(){$('viewModal').classList.remove('show')}
function fillForm(){['title','type','season','servings','wine','chef','rating','source','image','notes'].forEach(k=>$(k).value=current[k]??'');updatePhotoPreview();drawRows()}function drawRows(){$('ingredientRows').innerHTML=(current.ingredients||['']).map((x,i)=>`<div class="row"><input class="field ing" value="${esc(x)}"><button class="iconbtn" onclick="removeIng(${i})">×</button></div>`).join('');$('stepRows').innerHTML=(current.steps||['']).map((x,i)=>`<div class="row"><textarea class="field step" rows="2">${esc(x)}</textarea><button class="iconbtn" onclick="removeStep(${i})">×</button></div>`).join('')}function syncRows(){current.ingredients=[...document.querySelectorAll('.ing')].map(x=>x.value);current.steps=[...document.querySelectorAll('.step')].map(x=>x.value)}function addIngredient(){syncRows();current.ingredients.push('');drawRows()}function addStep(){syncRows();current.steps.push('');drawRows()}function removeIng(i){syncRows();current.ingredients.splice(i,1);if(!current.ingredients.length)current.ingredients=[''];drawRows()}function removeStep(i){syncRows();current.steps.splice(i,1);if(!current.steps.length)current.steps=[''];drawRows()}
function updatePhotoPreview(){let p=$('photoPreview'),u=$('image').value;p.style.backgroundImage=u?`url("${u.replace(/"/g,'%22')}")`:'';p.textContent=u?'':'Geen foto'}async function choosePhoto(e){let f=e.target.files?.[0];if(!f)return;try{let im=new Image(),u=URL.createObjectURL(f);await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=u});let s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);$('image').value=c.toDataURL('image/jpeg',.82);updatePhotoPreview()}catch{alert('Deze foto kon niet worden geladen.')}e.target.value=''}function removePhoto(){$('image').value='';updatePhotoPreview()}
function saveRecipe(){syncRows();['title','type','season','servings','wine','chef','rating','source','image','notes'].forEach(k=>current[k]=$(k).value);current.ingredients=current.ingredients.filter(Boolean);current.steps=current.steps.filter(Boolean);if(!current.title.trim())return alert('Geef het recept eerst een titel.');if(!current.id){current.id=crypto.randomUUID();recipes.unshift(current)}else recipes[recipes.findIndex(r=>r.id===current.id)]=current;persist();closeEdit();viewRecipe(current.id)}function deleteCurrent(){if(current?.id&&confirm('Dit recept verwijderen?')){recipes=recipes.filter(r=>r.id!==current.id);persist();closeEdit()}}
function stepHtml(x){x=String(x||'');if(x.startsWith('§ '))return `<li class="step-section">${esc(x.slice(2))}</li>`;return `<li><span>${esc(x)}</span></li>`}
function viewRecipe(id){current=recipes.find(r=>r.id===id);let r=current,v=$('recipeView'),src='';if(r.source){let safe=esc(r.source);src=`<p class="source"><b>Originele bron:</b> <a href="${safe}" target="_blank" rel="noopener">${safe}</a></p>`}v.innerHTML=`<div class="hero"><div class="heroTitle"><div class="stars">${'★'.repeat(+r.rating||0)}${'☆'.repeat(5-(+r.rating||0))}</div><h1>${esc(r.title)}</h1></div></div><div class="recipebody"><div class="facts">${[['Soort',r.type],['Seizoen',r.season],['Aantal',r.servings],['Wijn',r.wine],['Chef / Bron',r.chef]].map(x=>`<div class="fact"><b>${x[0]}</b>${esc(x[1]||'—')}</div>`).join('')}</div><div class="columns"><section><h2>Ingrediënten</h2><ul class="ingredients">${(r.ingredients||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${r.notes?`<h2>Notities</h2><p>${esc(r.notes).replace(/\n/g,'<br>')}</p>`:''}</section><section><h2>Bereiding</h2><ol class="steps">${(r.steps||[]).map(stepHtml).join('')}</ol></section></div>${src}</div>`;let h=v.querySelector('.hero');if(r.image)h.style.backgroundImage=`url("${r.image.replace(/"/g,'%22')}")`;$('viewModal').classList.add('show')}function editFromView(){closeView();openEditor('Recept bewerken',false)}
function exportBackup(){let blob=new Blob([JSON.stringify({app:'Mijn Recepten',version:4,exportedAt:new Date().toISOString(),recipes},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mijn-recepten-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restoreBackup(e){let f=e.target.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text()),x=Array.isArray(d)?d:d.recipes;if(!Array.isArray(x))throw 0;if(confirm('Huidige recepten vervangen door deze back-up?')){recipes=x;persist();alert('Back-up hersteld.')}}catch{alert('Geen geldige back-up.')}e.target.value=''}
function setStatus(msg,type=''){$('importStatus').textContent=msg;$('importStatus').className='status'+(msg?' show':'')+(type?' '+type:'')}async function importRecipe(){let url=$('importUrl').value.trim();if(!url)return setStatus('Plak eerst een geldige receptlink.','err');try{new URL(url)}catch{return setStatus('Deze link lijkt niet geldig.','err')}let btn=$('importBtn');btn.disabled=true;btn.textContent='Bezig…';setStatus('Recept wordt opgehaald…');try{let endpoint=location.hostname.endsWith('vercel.app')?'/api/import':API,res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})}),data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'De website kon niet worden verwerkt.');let r=data.recipe;if(!r)throw Error('Geen receptgegevens ontvangen.');current={...blank(),...r,id:null,rating:0,source:url,ingredients:r.ingredients?.length?r.ingredients:[''],steps:r.steps?.length?r.steps:['']};if((r.prepTime||r.cookTime||r.totalTime)&&!current.notes){let times=[];if(r.prepTime)times.push('Voorbereiding: '+r.prepTime);if(r.cookTime)times.push('Bereiding: '+r.cookTime);if(r.totalTime)times.push('Totale tijd: '+r.totalTime);current.notes=times.join(' · ')}fillForm();$('importArea').style.display='block';$('importUrl').value=url;let realSteps=current.steps.filter(x=>!String(x).startsWith('§ ')).length;setStatus(`Recept gevonden: ${current.ingredients.length} ingrediënten en ${realSteps} stappen. Controleer alles en bewaar daarna het recept.`,'ok')}catch(e){setStatus('Importeren lukte nog niet: '+e.message,'err')}finally{btn.disabled=false;btn.textContent='Importeer'}}
seed();render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
